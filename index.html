<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=6.0">
<title>Inarama — Atlas</title>
<link rel="stylesheet" href="lib/leaflet.css"/>
<style>
  html,body{margin:0;height:100%;background:#000;
    font-family:var(--f-ui);color:var(--txt);transition:color var(--tr)}
  #map{position:absolute;inset:0}
  /* Le fond derrière la carte dépend du FOND DE CARTE, jamais du thème.
     theme.js pose la couleur en style inline sur cet élément — c'est la
     seule portée qui ne se fasse pas écraser par les variables de <body>. */
  .leaflet-container{background:#000;font-family:var(--f-ui);
    /* PAS le raccourci "background" : il couvrirait background-size et
       background-position, que theme.js recale a chaque frame du deplacement —
       le fond traînerait un quart de seconde derriere la carte. */
    transition:background-color .25s ease}
  /* le chevron du sélecteur de couches : image absente du dépôt, on la dessine */
  a.leaflet-control-layers-toggle{background-image:none}
  /* le decor complet (parchemin+ornement) : le masque decoupe l'ouverture ovale
     et l'exterieur de la feuille -> il RECOUVRE la carte, sauf l'ovale central */
  .pdecor-frame{-webkit-mask-image:url('img/decor_mask.png');mask-image:url('img/decor_mask.png');
    -webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
  a.leaflet-control-layers-toggle::before{content:"\2630";font-size:19px;
    display:flex;align-items:center;justify-content:center;height:100%}
  /* ─── styles portés PAR LA CARTE : hors périmètre de la refonte ─── */
  .lbl{background:none;border:none;box-shadow:none;color:#f3ede0;font-size:11px;font-weight:600;
    text-shadow:0 0 3px #000,0 0 3px #000,0 1px 2px #000;padding:0}
  .roylbl{color:#141414;font:700 18px Arial,sans-serif;white-space:nowrap;pointer-events:none;
    transform:translate(-50%,-50%);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff,0 1px 1px #fff}
  .roylbl.clic{pointer-events:auto;cursor:pointer;padding:14px 18px}
  .roylbl.clic:hover{text-decoration:underline}
  .provlbl{color:#2a2a2a;font:italic 500 14px Arial,sans-serif;white-space:nowrap;pointer-events:none;
    transform:translate(-50%,-50%);text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 1px 1px #fff}
  .provlbl.clic{pointer-events:auto;cursor:pointer;padding:12px 16px}
  .provlbl.clic:hover{text-decoration:underline}
  /* ===== police d'époque IM Fell (OFL), appliquée au fond Parchemin ===== */
  @font-face{font-family:'IMFell';src:url('fonts/IMFellEnglish-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'IMFell';src:url('fonts/IMFellEnglish-Italic.ttf') format('truetype');font-weight:400;font-style:italic;font-display:swap}
  @font-face{font-family:'IMFellSC';src:url('fonts/IMFellEnglishSC.ttf') format('truetype');font-weight:400;font-display:swap}
  body.parch .roylbl{font-family:'IMFellSC',Georgia,serif;font-weight:400;font-size:21px;color:#3a2614;letter-spacing:.05em;
    text-shadow:0 0 3px #ece0c6,0 0 3px #ece0c6,0 0 5px #ece0c6,0 1px 1px #ece0c6}
  body.parch .provlbl{font-family:'IMFell',Georgia,serif;font-style:italic;font-weight:400;font-size:16px;color:#57422a;
    text-shadow:0 0 2px #ece0c6,0 0 3px #ece0c6,0 1px 1px #ece0c6}
  body.parch .lbl{font-family:'IMFell',Georgia,serif;font-weight:400;font-size:13px;color:#3f2c18;
    text-shadow:0 0 3px #ece0c6,0 0 3px #ece0c6,0 0 4px #ece0c6,0 1px 1px #ece0c6}
  /* Le chrome (marque, contrôles Leaflet, légendes, échelle) vit désormais
     dans css/theme.css, en variables de thème. */
</style>
<!-- theme.css EN PREMIER : il définit les variables que les autres consomment -->
<link rel="stylesheet" href="css/theme.css?v=2026-08-27f">
<link rel="stylesheet" href="css/search.css?v=2026-08-27f">
<link rel="stylesheet" href="css/panel.css?v=2026-08-27f">
<link rel="stylesheet" href="css/explo.css?v=2026-08-27f">
</head>
<body>
<div id="map"></div>
<div id="brand">INARAMA<small>ATLAS DU MONDE</small></div>
<div id="legend"></div>
<button id="legendBtn" type="button" onclick="legendToggle(true)">Légende</button>
<div id="rechBar" role="search">
  <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
    <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 L14.5 14.5" stroke-linecap="round"/></svg>
  <span class="ph">Rechercher un lieu, un royaume, un article…</span>
  <kbd>Ctrl K</kbd>
  <input id="rechInput" type="search" autocomplete="off" spellcheck="false"
         aria-label="Rechercher dans l'atlas et le lore">
</div>
<div id="rechRes" role="listbox" aria-label="Résultats de recherche"></div>

<script>
window.INARAMA_BUILD='2026-08-27f';   // bump à chaque mise à jour de données (cache-busting)
window.INARAMA={_d:{},_cb:{},_inj:{},_pend:{},
  reg:function(n,d){this._d[n]=d;(this._cb[n]||[]).forEach(f=>f(d));this._cb[n]=[];},
  load:function(n,cb){if(this._d[n])return cb(this._d[n]);
    (this._cb[n]=this._cb[n]||[]).push(cb);
    if(this._inj[n])return;this._inj[n]=1;
    var s=document.createElement('script');s.src='data/'+n+'.js?v='+window.INARAMA_BUILD;s.async=true;document.body.appendChild(s);},
  // garde SYNCHRONE posée AVANT le téléchargement : si l'utilisateur (dé)coche une couche ou
  // franchit un palier de zoom pendant le chargement, le même callback était mis en file 2 fois
  // et s'exécutait 2 fois -> le 1er calque construit restait orphelin sur la carte (plus aucune
  // référence JS ne le suivait), donc impossible à retirer. Une seule mise en file par clé.
  loadOnce:function(n,cb){if(this._d[n])return cb(this._d[n]);
    if(this._pend[n])return; this._pend[n]=1;
    var self=this; this.load(n,function(d){self._pend[n]=0;cb(d);});}};
</script>
<script src="lib/leaflet.js"></script>
<script>
/* ===== repère monde (aligné sur satellite_monde.tif) ===== */
const W=18764,H=26784,MAXZ=7,RES=2.0;
const XMIN=-18764.690210918135563,YMAX=26779.558561177349475;
const map=L.map('map',{crs:L.CRS.Simple,minZoom:1,maxZoom:7,zoomSnap:.5,
  wheelPxPerZoomLevel:120,preferCanvas:true});
map.attributionControl.setPrefix('Inarama · Leaflet');
const bounds=L.latLngBounds(map.unproject([0,H],MAXZ),map.unproject([W,0],MAXZ));
map.setMaxBounds(bounds.pad(0.12));map.fitBounds(bounds);
const c2ll=c=>map.unproject([c[0],c[1]],MAXZ);
const cv=L.canvas({padding:.4});

/* ===== fonds ===== */
const tOpt=m=>({minNativeZoom:0,maxNativeZoom:m,tms:false,bounds:bounds,noWrap:true});
const bases={
  '🗺 Terrain':L.tileLayer('tiles/terrain/{z}/{x}/{y}.jpg',tOpt(7)).addTo(map),
  '🛰 Satellite':L.tileLayer('tiles/satellite/{z}/{x}/{y}.jpg',tOpt(7)),
  '📜 Parchemin':L.tileLayer('tiles/tolkien/{z}/{x}/{y}.jpg',tOpt(7))
};

/* ===== helpers geojson ===== */
function gj(d,o){o.coordsToLatLng=c2ll;return L.geoJSON(d,o);}

/* ===== couche à paliers (lignes révélées au zoom) ===== */
function tieredLine(name,parts){
  // parts: [{key, filter(f), style, reveal}]  loaded from one data key
  let on=false,built=false,subs=[];
  function build(d){ built=true;
    parts.forEach(p=>{ p.layer=gj(d,{filter:p.filter,style:p.style}); subs.push(p); });
    update();
  }
  function update(){ if(!on){subs.forEach(p=>map.removeLayer(p.layer));return;}
    const z=map.getZoom();
    subs.forEach(p=>{ if(z>=p.reveal){ if(!map.hasLayer(p.layer))p.layer.addTo(map);}
                      else map.removeLayer(p.layer); }); }
  return {group:L.layerGroup(),
    add(){on=true; if(!built)INARAMA.loadOnce(name,build); else update();},
    remove(){on=false;update();}, zoom(){if(on)update();}};
}

/* ===== RIVIÈRES (3 paliers de débit) ===== */
const rivStyle=w=>()=>({color:'#5a97cf',weight:w,opacity:.9,lineCap:'round'});
const rivRenderer=L.canvas({padding:.4});   // renderer dédié -> retrait propre (repaint garanti)
let rivOn=false,rivL={};
function rivEnsure(t){ if(rivL[t]){if(rivOn&&map.getZoom()>=rivRev[t]&&!map.hasLayer(rivL[t]))rivL[t].addTo(map);return;}
  INARAMA.loadOnce('rivieres_'+t,d=>{rivL[t]=gj(d,{renderer:rivRenderer,style:rivStyle(t==1?1.9:t==2?1.2:.8)});rivUpdate();}); }
const rivRev={1:2.5,2:4,3:5.5};
function rivUpdate(){ if(!rivOn){for(const t in rivL)map.removeLayer(rivL[t]);return;}
  const z=map.getZoom();
  [1,2,3].forEach(t=>{ if(z>=rivRev[t])rivEnsure(t); else if(rivL[t])map.removeLayer(rivL[t]); }); }

/* ===== ROUTES (par classe, révélées au zoom) ===== */
const rtCol='#6b4726';
const routes=tieredLine('routes',[
  {reveal:3.5,filter:f=>f.properties.classe===1,style:()=>({color:rtCol,weight:1.9,opacity:.85,lineCap:'round'})},
  {reveal:5,  filter:f=>f.properties.classe===2,style:()=>({color:rtCol,weight:1.2,opacity:.8,lineCap:'round'})},
  {reveal:6,  filter:f=>f.properties.classe===3,style:()=>({color:rtCol,weight:.7,opacity:.75,lineCap:'round'})},
  {reveal:7,  filter:f=>f.properties.classe===4,style:()=>({color:rtCol,weight:.5,opacity:.7,dashArray:'2,3'})}
]);
/* ===== ROUTES MARITIMES (par classe) ===== */
const routesMer=tieredLine('routes_mer',[
  {reveal:3,  filter:f=>f.properties.classe===1,style:()=>({color:'#3f8fa0',weight:1.4,opacity:.8,dashArray:'5,5'})},
  {reveal:5,  filter:f=>f.properties.classe===2,style:()=>({color:'#3f8fa0',weight:1.0,opacity:.75,dashArray:'4,5'})},
  {reveal:6,  filter:f=>f.properties.classe===3,style:()=>({color:'#3f8fa0',weight:.7,opacity:.7,dashArray:'3,4'})}
]);

/* ===== surcouches simples (lazy) ===== */
const simple={}, sBuilt={};
function simpleLayer(name,dataKey,make){ simple[name]=L.layerGroup();
  return {group:simple[name], add(){ if(!sBuilt[name]){sBuilt[name]=1;INARAMA.load(dataKey,d=>make(d,simple[name]));}}, remove(){}}; }

map.createPane('roy'); map.getPane('roy').style.zIndex=350;   // fond royaumes sous le reste
const royRenderer=L.canvas({pane:'roy',padding:.4});
/* superficie approx. en coords monde (formule du lacet) : sert à classer les royaumes */
function ringArea(r){let s=0;for(let i=0,n=r.length;i<n;i++){const a=r[i],b=r[(i+1)%n];s+=a[0]*b[1]-b[0]*a[1];}return Math.abs(s)/2;}
function geoArea(g){ if(!g)return -1;                       // -1 = aucun polygone (Yakuvara, maritime)
  if(g.type==='Polygon')return ringArea(g.coordinates[0]);
  if(g.type==='MultiPolygon')return g.coordinates.reduce((s,p)=>s+ringArea(p[0]),0);
  return -1; }
let royLbl=[];                                              // {m, rev} : libellé + seuil de zoom
function royZoom(){ const z=map.getZoom();
  royLbl.forEach(o=>{ if(o.m._icon) o.m._icon.style.display = z>=o.rev ? '' : 'none'; }); }
const royaumes=simpleLayer('Royaumes','royaumes',(d,g)=>{
  gj(d,{ renderer:royRenderer, pane:'roy',
    style:f=>{const c=f.properties.c||[136,136,136];
      return {color:'#20242c',weight:.7,opacity:.45,
              fillColor:'rgb('+c[0]+','+c[1]+','+c[2]+')',fillOpacity:.5};}
  }).addTo(g);
  // Les libellés n'avaient AUCUN seuil de zoom : en vue monde, 47 noms en 18px se
  // superposaient en un bloc illisible (provinces et lieux, eux, se révèlent au zoom).
  // Révélation progressive par SUPERFICIE : les plus vastes d'abord (z 1.5), les plus
  // petits en dernier (z 4) -> la vue monde ne garde que les grands ensembles.
  const fs=d.features.filter(f=>f.properties.lp).map(f=>({f,a:geoArea(f.geometry)}));
  const pos=fs.map(o=>o.a).filter(a=>a>0).sort((x,y)=>x-y);
  const med=pos.length?pos[Math.floor(pos.length/2)]:0;
  fs.forEach(o=>{ if(o.a<0)o.a=med; });                     // sans polygone -> rang médian
  fs.sort((x,y)=>y.a-x.a);
  const N=Math.max(1,fs.length-1);
  fs.forEach((o,i)=>{ const p=o.f.properties;
    // toujours cliquable depuis la Phase E : la fiche vaut même sans description
    // (compte de provinces, liste des enfants, renvoi au lore)
    const m=L.marker(c2ll(p.lp),{interactive:true,keyboard:false,
      icon:L.divIcon({className:'roylbl clic',html:(p.np||p.n),iconSize:[0,0]})}).addTo(g);
    m.on('click',()=>window.INARAMA_fiche.royaume(p.n));
    royLbl.push({m, rev:1.5+Math.round((i/N)*5)/2});        // 1.5 -> 4, par pas de 0.5
  });
  royZoom();
});

let provOn=false,provLayer=null;
let provLabels=[], provLblMk=new Map(), provLabelsData=false;
const provinces={group:L.layerGroup(),
  add(){provOn=true;
    if(!provLayer)INARAMA.loadOnce('provinces',d=>{provLayer=gj(d,{
      style:()=>({color:'#111111',weight:.9,opacity:.85,fill:false})}); provUpdate();});
    if(!provLabelsData)INARAMA.loadOnce('prov_labels',d=>{provLabelsData=true;
      // `prov` est indispensable depuis la Phase E : c'est la clé de la fiche
      provLabels=d.map(o=>({ll:c2ll(o.p),n:o.n,d:o.d,s:o.s,prov:o.prov})); provUpdate();});
    provUpdate();},
  remove(){provOn=false;provUpdate();}};
function provUpdate(){
  const show=provOn&&map.getZoom()>=3;
  if(provLayer){ show?(map.hasLayer(provLayer)||provLayer.addTo(map)):map.removeLayer(provLayer); }
  provLabelSync();
}
function provLabelSync(){
  const show=provOn&&map.getZoom()>=4;   // noms de provinces à partir du zoom 4
  if(!show){ provLblMk.forEach(m=>map.removeLayer(m)); provLblMk.clear(); return; }
  const b=map.getBounds().pad(0.2);
  provLabels.forEach(o=>{ const vis=b.contains(o.ll); let m=provLblMk.get(o);
    if(vis&&!m){ m=L.marker(o.ll,{interactive:true,keyboard:false,
        icon:L.divIcon({className:'provlbl clic',html:o.n,iconSize:[0,0]})}).addTo(map);
      m.on('click',()=>window.INARAMA_fiche.province(o.prov));
      provLblMk.set(o,m); }
    else if(!vis&&m){ map.removeLayer(m); provLblMk.delete(o); } });
}
const courants=simpleLayer('Courants','courants',(d,g)=>gj(d,{
  style:()=>({color:'#5fb0d8',weight:.7,opacity:.28})}).addTo(g));

/* Terres sauvages = surcouche raster (shapeburst baké, tache à opacité variable) */
const terres=L.tileLayer('tiles/terres/{z}/{x}/{y}.png',tOpt(7));

/* ===== LIEUX : formes SVG par type, couleur par rareté, révélation + virtualisation ===== */
const RAR={1:'#2f9e5f',2:'#2f74c8',3:'#9a3fb5',4:'#f2c531',5:'#d23b2e',0:'#9aa0a6'};
function rarCol(n){return RAR[n]||RAR[0];}
function sizeForZoom(z){return Math.round(Math.min(23, 11 + Math.max(0,z-2)*2.0)*2)/2;} // taille uniforme, grandit au zoom
function ptsPoly(cx,cy,r,n,rot){let a=[];for(let i=0;i<n;i++){let t=rot+i*2*Math.PI/n;a.push((cx+r*Math.cos(t)).toFixed(1)+','+(cy+r*Math.sin(t)).toFixed(1));}return a.join(' ');}
function ptsStar(cx,cy,r,n,rot,f){let a=[];for(let i=0;i<2*n;i++){let rr=i%2?r*f:r;let t=rot+i*Math.PI/n;a.push((cx+rr*Math.cos(t)).toFixed(1)+','+(cy+rr*Math.sin(t)).toFixed(1));}return a.join(' ');}
const iconCache={};
const HIT=32;   // zone de clic minimale (px). L'icône VISIBLE garde sa taille : on n'élargit
                // que la boîte transparente autour. Compromis assumé : 44px (recommandation
                // tactile) masquerait trop les libellés de province en zone dense.
// dessine la forme (taille visuelle s) centrée dans une boîte S ; S>s = marge transparente
function lieuSvg(type,niv,star,s,S){
  const col=rarCol(niv), c=S/2, r=s/2;
  const ol='stroke="#232323" stroke-width="1.1"';
  let shape;
  if(star===1) shape=`<polygon points="${ptsStar(c,c,r*1.05,5,-Math.PI/2,0.42)}" fill="${col}" ${ol}/>`;
  else if(type==='sanctuaire') shape=`<polygon points="${ptsStar(c,c,r*1.15,8,-Math.PI/2,0.52)}" fill="${col}" ${ol}/>`;
  else if(type==='academie') shape=`<polygon points="${ptsPoly(c,c,r*1.1,3,-Math.PI/2)}" fill="${col}" ${ol}/>`;
  else if(type==='guilde') shape=`<polygon points="${ptsPoly(c,c,r*1.1,4,-Math.PI/2)}" fill="${col}" ${ol}/>`;
  else if(type==='arene'){ const Ro=r*0.95, Ri=r*0.44,
      circ=R=>`M${(c-R).toFixed(1)},${c.toFixed(1)} a${R.toFixed(1)},${R.toFixed(1)} 0 1,0 ${(2*R).toFixed(1)},0 a${R.toFixed(1)},${R.toFixed(1)} 0 1,0 ${(-2*R).toFixed(1)},0Z`;
    shape=`<path d="${circ(Ro)} ${circ(Ri)}" fill-rule="evenodd" fill="${col}" ${ol}/>`; }
  else shape=`<circle cx="${c}" cy="${c}" r="${r*0.9}" fill="${col}" ${ol}/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">${shape}</svg>`;
}
function lieuIcon(type,niv,star,s){
  const key=type+'|'+niv+'|'+star+'|'+s;
  if(iconCache[key])return iconCache[key];
  const S=Math.max(Math.ceil(s+6),HIT), c=S/2;
  const ic=L.icon({iconUrl:'data:image/svg+xml,'+encodeURIComponent(lieuSvg(type,niv,star,s,S)),
                   iconSize:[S,S],iconAnchor:[c,c]});
  return iconCache[key]=ic;
}
let lieuxOn=false, lieuxFeat=[], lieuxMk=new Map(), lieuxData=false;
function revZoom(niv){ return niv>=5?1 : niv>=4?2.5 : niv>=3?3.5 : niv>=2?4.5 : 5.5; }
function lblRevZoom(niv){ return niv>=5?2.5 : niv>=4?4 : niv>=3?5 : niv>=2?5.5 : 6; } // noms révélés après les points
function lieuxBuild(d){ lieuxData=true;
  lieuxFeat=d.features.map(f=>{const p=f.properties;return {ll:c2ll(f.geometry.coordinates),p:p,
    niv:p.niveau||0, key:(p.etoile5===1?'e5':p.type)+'|'+(p.niveau||0)};});
  lieuxSync();
}
let lieuxSizeCur=0;
function lieuxSync(){
  if(!lieuxData)return;
  if(!lieuxOn){ lieuxMk.forEach(m=>map.removeLayer(m)); lieuxMk.clear(); return; }
  const z=map.getZoom(), b=map.getBounds().pad(0.25), sz=sizeForZoom(z);
  lieuxFeat.forEach(f=>{
    // INARAMA_filtre : posé par js/explo.js (Phase F). Null = aucun filtre actif.
    const show = z>=revZoom(f.niv) && b.contains(f.ll)
                 && (!window.INARAMA_filtre || window.INARAMA_filtre(f.p));
    let m=lieuxMk.get(f);
    if(show && !m){ m=L.marker(f.ll,{icon:lieuIcon(f.p.type,f.niv,(f.p.etoile5===1||f.p.capitale===1)?1:0,sz),
        riseOnHover:true,keyboard:false});
      m.on('click',()=>window.INARAMA_fiche.lieu(f.p.id));
      if(f.p.nom)m.bindTooltip(f.p.nom,{className:'lbl',direction:'top',offset:[0,-10],permanent:true});
      m.addTo(map); lieuxMk.set(f,m);
    } else if(!show && m){ map.removeLayer(m); lieuxMk.delete(f); }
  });
  // redimensionne les marqueurs existants quand le palier de zoom change
  if(sz!==lieuxSizeCur){ lieuxSizeCur=sz;
    lieuxMk.forEach((m,f)=>m.setIcon(lieuIcon(f.p.type,f.niv,(f.p.etoile5===1||f.p.capitale===1)?1:0,sz))); }
  // noms : ouverts/fermés selon rareté + zoom (les points sans nom visible restent cliquables)
  lieuxMk.forEach((m,f)=>{ if(m.getTooltip()){ (z>=lblRevZoom(f.niv))?m.openTooltip():m.closeTooltip(); } });
}
const lieux={group:L.layerGroup(),
             add(){lieuxOn=true; if(!lieuxData)INARAMA.loadOnce('lieux',lieuxBuild); else lieuxSync();},
             remove(){lieuxOn=false;lieuxSync();}};

/* ===== contrôle des couches ===== */
const overlayDefs={
  'Lieux':lieux, 'Royaumes':royaumes, 'Provinces':provinces,
  'Terres sauvages':{group:terres,add(){terresLegend(true);terresHover(true)},remove(){terresLegend(false);terresHover(false)}},
  'Rivières':{group:L.layerGroup(),add(){rivOn=true;rivUpdate();},remove(){rivOn=false;rivUpdate();}},
  'Routes':routes, 'Routes maritimes':routesMer, 'Courants marins':courants
};
const overlays={};
for(const n in overlayDefs) overlays[n]=overlayDefs[n].group;
const layersCtl=L.control.layers(bases,overlays,{collapsed:window.innerWidth<900,position:'topright'}).addTo(map);
// le mode replié n'était évalué qu'au chargement : on le réévalue au redimensionnement.
// Repli SEULEMENT en rétrécissant (un panneau large mangeait un viewport devenu étroit) ;
// jamais de dépliage automatique, pour ne pas rouvrir ce que l'utilisateur a fermé.
let scNarrow=window.innerWidth<900, scT;
addEventListener('resize',()=>{clearTimeout(scT);scT=setTimeout(()=>{
  const n=window.innerWidth<900; if(n&&!scNarrow)layersCtl.collapse(); scNarrow=n; },200);});

/* ===== échelle graphique (km réels) =====
   CRS.Simple : pas de distorsion de projection, l'échelle ne dépend que du zoom.
   1 pixel natif (au zoom MAXZ) = RES km, d'où la mesure via project(...,MAXZ). */
const ScaleKm=L.Control.extend({
  options:{position:'bottomleft',maxWidth:130},
  onAdd:function(m){ this._el=L.DomUtil.create('div','ina-scale');
    m.on('zoomend',this._upd,this); this._upd(); return this._el; },
  onRemove:function(m){ m.off('zoomend',this._upd,this); },
  _upd:function(){ const m=this._map,y=m.getSize().y/2,W=this.options.maxWidth;
    const a=m.project(m.containerPointToLatLng([0,y]),MAXZ),
          b=m.project(m.containerPointToLatLng([W,y]),MAXZ);
    const kmMax=Math.abs(b.x-a.x)*RES;                      // km couverts par W px écran
    const p=Math.pow(10,Math.floor(Math.log10(kmMax))),f=kmMax/p;
    const km=(f>=5?5:f>=2?2:1)*p;                           // palier « rond » 1/2/5 ×10ⁿ
    this._el.style.width=Math.round(W*km/kmMax)+'px';
    this._el.textContent=km.toLocaleString('fr-FR')+' km'; }
});
map.addControl(new ScaleKm());
// labels calligraphiés (IM Fell) quand le fond Parchemin est actif
// fond Parchemin : labels calligraphiés + surcouche décor (cadre/cartouches/roses) calée sur la carte
// ── Fond Parchemin — la SCENE 3D est le decor ─────────────────────────────
// La feuille, ses ornements, la table, les bougies et les objets sortent tous
// du meme rendu. Ils sont donc composes en 3D, avec le bon empilement — la
// feuille SOUS les objets poses dessus — et le bon eclairage. Plus rien de tout
// cela n'est reconstitue en 2D : c'etait la source de tous les decalages.
//
// Ces rendus sont servis en TUILES, comme la carte, et pour la meme raison. La
// camera a filme trois paliers a hauteur constante, chacun balaye lateralement.
// Sur un palier donne, tous les rendus sont a la MEME echelle et ne different
// que d'une translation : on peut donc les recoudre en une seule grande image
// par niveau de zoom (web/build/mosaique.py, puis decor.py pour la decoupe).
// Le decor est ainsi net a chaque zoom, sans jamais agrandir un pixel.
//
// La carte vient s'inscrire dans la fenetre laissee vide au centre. Elle est
// decoupee sur le trace EXACT de cette ouverture — le second sous-chemin de
// "Ornement-1" dans le master, 15 035 caracteres de courbes — pris en
// vectoriel : le bord de l'ouverture ne peut donc pas pixeliser.
const _B=window.INARAMA_BUILD;

// CALAGE, calcule et non suppose. La feuille occupe le viewBox du master
// (8857x8925), et le master est cale sur le monde par le groupe "image-carte" :
// matrix(1.141732,0,0,1.141732,2653.172283,2019.192913) sur une image 3000x4280
// qui EST la carte. En inversant, le viewBox couvre le monde de
// (-14534.7,-11067.4) a (33986.0,37851.4). Tuiles du decor, tuiles de la carte
// et decoupe partagent ce repere : ils se calent donc sans aucun reglage.
const _fX0=-14534.7, _fY0=-11067.4, _fX1=33986.0, _fY1=37851.4;
const _fW=_fX1-_fX0, _fH=_fY1-_fY0;
const _pB=L.latLngBounds(c2ll([_fX0,_fY0]), c2ll([_fX1,_fY1]));
// emprise du decor : ce que couvre le palier large, seul a aller jusqu'au bord
// de la table. Mesuree sur la mosaique, pas choisie.
// Le meme recalage que les tuiles y est applique (web/build/decor.py, CALAGE) :
// sans lui la video des flammes flottait a 352 px monde des corps de bougie
// qu'elle est censee surmonter.
const _CALAGE_X=-352, _CALAGE_Y=-32;
const _dX0=-47746+_CALAGE_X, _dY0=-19847+_CALAGE_Y,
      _dX1= 67198+_CALAGE_X, _dY1= 44857+_CALAGE_Y;
const _dW=_dX1-_dX0, _dH=_dY1-_dY0;
const _dB=L.latLngBounds(c2ll([_dX0,_dY0]), c2ll([_dX1,_dY1]));

map.createPane('decor');    map.getPane('decor').style.zIndex=150;    // sous les tuiles
map.createPane('flamme');   map.getPane('flamme').style.zIndex=690;   // au-dessus des ornements
map.createPane('grille');   map.getPane('grille').style.zIndex=350;   // sur la carte, sous les marqueurs
map.createPane('ornement'); map.getPane('ornement').style.zIndex=680; // au-dessus de TOUT le contenu
for(const p of ['decor','flamme','grille','ornement']) map.getPane(p).style.pointerEvents='none';

const _vide='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const _optDecor=z=>({minNativeZoom:1,maxNativeZoom:4,noWrap:true,pane:z,
   errorTileUrl:_vide,updateWhenZooming:false,keepBuffer:3});
const parchDecor=L.tileLayer('tiles/decor/{z}/{x}/{y}.jpg?v='+_B,_optDecor('decor'));

// LES ORNEMENTS MASQUENT, PUIS S'EFFACENT. Ce sont les MEMES tuiles, reposees
// au-dessus de tout le contenu et decoupees en complementaire de l'ouverture :
// elles ne montrent donc que l'anneau, le bord de la feuille et la table. Tant
// qu'elles sont opaques, rien de ce qui deborde de l'ouverture ne se voit —
// ni les tuiles, ni les royaumes, ni les lieux. En approchant elles s'effacent
// et decouvrent la carte reelle, que l'on avait deja laissee s'etendre dessous.
// Le navigateur ne retelecharge rien : ce sont les tuiles deja en cache.
const parchOrn=L.tileLayer('tiles/decor/{z}/{x}/{y}.jpg?v='+_B,_optDecor('ornement'));
const Z_OUVRE=4.0, Z_NU=5.5;   // debut et fin du devoilement

// GLISSEMENT DU DECOR. Les tuiles portent deja un recalage de -352 px monde
// (web/build/decor.py). Celui-ci s'y ajoute, et se regle sans rien refabriquer :
// ?decor=-352 dans l'URL, et l'anneau glisse en direct. On deplace le CONTENU
// des panneaux, pas les panneaux eux-memes : leur decoupe appartient a la
// carte et doit rester ou elle est.
const _decorDX = (()=>{ const v=parseFloat(new URLSearchParams(location.search).get('decor'));
                        return isFinite(v) ? v : -352; })();
function glisseDecor(){
  const d=_decorDX*Math.pow(2,map.getZoom()-MAXZ);
  const t=d ? 'translate('+d.toFixed(2)+'px,0)' : '';
  const p=map.getPane('decor'); if(p) p.style.transform=t;
  for(const n of ['ornement','flamme']){
    const q=map.getPane(n); if(q) for(const c of q.children) c.style.transform=t;
  }
}

// LE VACILLEMENT. Le palier de la vue d'ensemble a ete rendu camera fixe : ses
// 50 images ne different que par les flammes. C'est donc exactement la meme
// image que la tuile de ce niveau, mais animee — le passage de l'une a l'autre
// ne se voit pas. Au-dela, les bougies sortent du champ et la video, qui ferait
// alors plusieurs dizaines de milliers de pixels, est retiree.
// Panneau distinct, et TOUT EN HAUT. Deux couches la recouvraient tour a tour :
// le conteneur de tuiles du decor, qui porte un z-index 1, puis le calque
// d'ornement pose a 680. Elle tournait donc sans jamais etre vue. Placee
// au-dessus de tout, elle est decoupee en complementaire de l'ouverture — sinon
// elle masquerait la carte, puisque le rendu couvre aussi le centre.
const parchFlamme=L.videoOverlay('img/bougies.webm?v='+_B, _dB,
  {interactive:false,pane:'flamme',className:'pflamme',autoplay:true,loop:true,
   muted:true,playsInline:true,keepAspectRatio:false});
let _flammeOn=false;
function majFlamme(){
  const on=document.body.classList.contains('parch') && map.getZoom()<=2.75;
  if(on!==_flammeOn){
    _flammeOn=on;
    if(on) parchFlamme.addTo(map); else map.removeLayer(parchFlamme);
  }
  // relancer a CHAQUE passage, pas seulement a l'ajout : une video mise en
  // pause pendant un geste ne repart pas d'elle-meme.
  const v=parchFlamme.getElement();
  if(on&&v){ v.muted=true; if(v.paused) v.play&&v.play().catch(()=>{}); }
}
map.on('movestart zoomstart',()=>{ const v=parchFlamme.getElement(); if(_flammeOn&&v) v.pause(); });
map.on('moveend zoomend',   ()=>{ majFlamme(); });

// DECOUPE de la carte sur l'ouverture. Le trace vit dans un <clipPath> exprime
// en coordonnees master : on ne recalcule donc jamais ses 4 445 sommets, on ne
// met a jour qu'une transformation affine — deux points suffisent a la definir.
let _fen=null, _fenEnCours=false;
function chargeFenetre(){
  if(_fen||_fenEnCours) return;
  _fenEnCours=true;
  fetch('svg/fenetre.svg?v='+_B).then(r=>r.text()).then(t=>{
    const d=document.createElement('div');
    d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
    d.innerHTML=t; document.body.appendChild(d);
    _fen=[...d.querySelectorAll('clipPath > path')];
    _fenEnCours=false; caleFenetre(); majParch();
  }).catch(e=>{ _fenEnCours=false; console.warn('fenetre :',e); });
}
// Aucune correction ici. Le master est coherent avec lui-meme : la carte y est
// centree dans l'ouverture, a 65,7 unites du bord gauche et 67,2 du droit. Le
// decalage venait du RENDU, ou l'encre des ornements avait glisse de 64,3
// unites ; il est corrige a la fabrication des tuiles (web/build/decor.py).
// Deplacer la decoupe, comme je l'avais fait, ne faisait que desolidariser la
// carte des ornements — la carte se retrouvait collee a gauche de l'ouverture.
function caleFenetre(){
  if(!_fen) { chargeFenetre(); return; }
  const a=map.latLngToLayerPoint(c2ll([_fX0,_fY0]));
  const b=map.latLngToLayerPoint(c2ll([_fX1,_fY1]));
  const kx=(b.x-a.x)/8857, ky=(b.y-a.y)/8925;
  const t='translate('+a.x+' '+a.y+') scale('+kx+' '+ky+')';
  for(const e of _fen) e.setAttribute('transform',t);
}
window.INARAMA_caleFenetre=caleFenetre;

// Consequence directe du calage : le decor ne couvre l'ecran que jusqu'a un
// certain recul. On arrete donc le dezoom la — au zoom minimal on a exactement
// la scene du rendu Blender. Le seuil depend de la fenetre du navigateur, il se
// recalcule au redimensionnement plutot que d'etre une constante fausse ailleurs.
let _zMini=1;
function caleZooms(){
  const t=map.getSize();
  // conteneur pas encore mesure (onglet cache, mise en page en cours) : log2(0)
  // vaut -Infinity et emporterait le zoom minimal avec lui
  if(t.x<2||t.y<2) return;
  const parch=document.body.classList.contains('parch');
  _zMini=MAXZ+Math.log2(Math.max(t.x/_dW, t.y/_dH));
  const vise=parch?_zMini:1;
  if(Math.abs(map.getMinZoom()-vise)>0.01) map.setMinZoom(vise);
  // en Parchemin on doit pouvoir se promener sur toute la feuille, pas
  // seulement sur la carte : sinon les ornements restent hors d'atteinte
  map.setMaxBounds(parch ? _pB.pad(0.03) : bounds.pad(0.12));
}

// la grille reste VECTORIELLE : elle est le seul trait pose sur la carte, et
// "non-scaling-stroke" lui garde la meme finesse a l'ecran a tous les zooms
let parchGrille=null, _svgEnCours=false;
function chargeSVG(){
  if(_svgEnCours||parchGrille) return;
  _svgEnCours=true;
  fetch('svg/grille.svg?v='+_B).then(r=>r.text())
    .then(t=>new DOMParser().parseFromString(t,'image/svg+xml').documentElement)
    .then(g=>{
      parchGrille=L.svgOverlay(g,_pB,{interactive:false,pane:'grille',className:'pgrille'});
      _svgEnCours=false; majParch();
    }).catch(e=>{ _svgEnCours=false; console.warn('grille :',e); });
}

// La decoupe ne peut pas se limiter aux TUILES : royaumes, provinces, rivieres,
// routes et lieux vivent dans d'autres panneaux et debordaient allegrement sur
// les ornements. On borne donc tout ce qui appartient a la carte.
const _PANNEAUX=['tilePane','roy','overlayPane','grille','tz','shadowPane','markerPane'];
function rectMonde(){
  const a=map.latLngToLayerPoint(bounds.getNorthWest());
  const b=map.latLngToLayerPoint(bounds.getSouthEast());
  return 'polygon('+a.x+'px '+a.y+'px,'+b.x+'px '+a.y+'px,'+b.x+'px '+b.y+'px,'+a.x+'px '+b.y+'px)';
}
function decoupeCarte(mode){   // 'fenetre' | 'monde' | null
  const dec = mode==='fenetre' ? 'url(#fenetreCarte)' : mode==='monde' ? rectMonde() : '';
  for(const n of _PANNEAUX){ const p=map.getPane(n); if(p) p.style.clipPath=dec; }
  // Le remplissage NOIR est cuit dans les tuiles JPEG : le monde est un
  // rectangle, la grille de tuiles ne tombe pas dessus, et la derniere colonne
  // porte du noir jusqu'au bord de sa tuile. Or l'ouverture est plus large que
  // la carte : elle laissait donc voir cette bande. On borne les tuiles au
  // rectangle du monde EN PLUS de la decoupe organique — deux elements
  // imbriques, donc deux decoupes qui se composent.
  const tp=map.getPane('tilePane');
  if(tp) for(const c of tp.children) c.style.clipPath = mode ? rectMonde() : '';
  const p=map.getPane('tilePane'); if(!p) return;
  const on=!!mode;
  // ETALONNAGE de la carte sur le parchemin. Mesure sur les tuiles assemblees :
  // le papier de la carte sort a (206,178,134), celui du decor a (134,93,45) —
  // soit un rapport de 0,65 / 0,51 / 0,34 par canal. Mais egaliser au produit
  // seul aplatit le relief, et c'est la lisibilite de la carte qui prime. On
  // garde donc le NIVEAU du papier et on ouvre le contraste de 30 % autour de
  // lui : le raccord au bord de l'ouverture reste invisible, le relief revient.
  // Applique en feColorMatrix, donc sur le GPU : les 344 Mo de tuiles ne sont
  // pas retouches, et le reglage reste un seul nombre dans svg/fenetre.svg.
  p.style.filter = on ? 'url(#tonCarte)' : '';
}
function majParch(){
  const on=document.body.classList.contains('parch');
  caleZooms(); caleFenetre();
  if(!on){
    decoupeCarte(null);
    for(const l of [parchDecor,parchOrn,parchGrille]) if(l&&map.hasLayer(l)) map.removeLayer(l);
    _flammeOn=false; if(map.hasLayer(parchFlamme)) map.removeLayer(parchFlamme);
    if(window.INARAMA_rogne) window.INARAMA_rogne();
    return;
  }
  map.hasLayer(parchDecor)||parchDecor.addTo(map);
  majFlamme(); glisseDecor();
  // l'anneau ne doit jamais mordre sur l'ouverture : decoupe complementaire
  for(const n of ['ornement','flamme']){
    const p=map.getPane(n); if(p) p.style.clipPath = _fen ? 'url(#horsFenetre)' : 'none';
  }

  // LE DEVOILEMENT. La carte s'etend au-dela de l'ouverture des que l'on
  // commence a approcher — mais sous des ornements encore opaques, donc rien ne
  // saute a l'ecran. Ce sont eux qui s'effacent ensuite, et decouvrent ce qui
  // etait deja la. Zoomer devient ainsi un moyen de trouver, pas un effet.
  const t=Math.max(0,Math.min(1,(map.getZoom()-Z_OUVRE)/(Z_NU-Z_OUVRE)));
  decoupeCarte(_fen ? (t>0 ? 'monde' : 'fenetre') : 'monde');
  if(t<1){ map.hasLayer(parchOrn)||parchOrn.addTo(map); parchOrn.setOpacity(1-t); }
  else if(map.hasLayer(parchOrn)) map.removeLayer(parchOrn);

  if(!parchGrille){ chargeSVG(); return; }
  map.hasLayer(parchGrille)||parchGrille.addTo(map);
}
window.INARAMA_majParch=majParch;
window.parchDecor=parchDecor;
const updateDecor=majParch;
map.on('resize',()=>{ caleZooms(); caleFenetre(); majFlamme(); });
map.on('baselayerchange',e=>{document.body.classList.toggle('parch', /Parchemin/.test(e.name));updateDecor();});
map.on('zoomend',updateDecor);
map.on('viewreset',()=>{ caleFenetre(); majParch(); });
map.on('zoom',()=>{ if(document.body.classList.contains('parch')){ caleFenetre(); glisseDecor(); } });

// royZoom() : réafficher la couche recrée les icônes -> il faut réappliquer les seuils
map.on('overlayadd',e=>{overlayDefs[e.name]&&overlayDefs[e.name].add(); buildLegend(); royZoom();});
map.on('overlayremove',e=>{overlayDefs[e.name]&&overlayDefs[e.name].remove(); buildLegend();});

[['Lieux',lieux],['Royaumes',royaumes]].forEach(([n,o])=>{

/* ===== légende CONTEXTUELLE : n'affiche que les couches réellement actives =====
   (avant : une seule section « Lieux », figée, pour 8 couches — et refermable
   définitivement, sans aucun moyen de la rouvrir) */
let legendOpen=window.innerWidth>640;   // mobile : repliée par défaut, PLUS jamais supprimée
function legendToggle(v){ legendOpen=v;
  document.getElementById('legend').style.display=v?'block':'none';
  document.getElementById('legendBtn').classList.toggle('on',!v); }
// échantillons conformes aux styles réels des couches
function swLine(col,w,dash,op){ return '<svg class="swl" viewBox="0 0 24 10">'+
  '<line x1="1" y1="5" x2="23" y2="5" stroke="'+col+'" stroke-width="'+Math.max(w,1.1)+'"'+
  (dash?' stroke-dasharray="'+dash+'"':'')+' stroke-linecap="round" opacity="'+(op||1)+'"/></svg>'; }
// vignette générée par lieuSvg = le marqueur RÉEL (les glyphes texte ● ▲ ✷ n'y correspondaient pas)
function swMk(type,star){ return '<img class="swi" alt="" src="data:image/svg+xml,'+
  encodeURIComponent(lieuSvg(type,3,star,15,21))+'">'; }
// déclaration de fonction (hoistée) : buildLegend est appelée par overlayadd DÈS l'init,
// avant ce bloc — un const/arrow serait en zone morte temporelle
function legRow(sw,txt){ return '<div class="row">'+sw+'<span>'+txt+'</span></div>'; }

function buildLegend(){
  const el=document.getElementById('legend'); if(!el)return;
  const on=n=>overlays[n]&&map.hasLayer(overlays[n]), S=[];
  if(on('Lieux')){
    S.push('<b>Rareté du lieu</b>'+[[5,'légendaire'],[4,'très rare'],[3,'rare'],[2,'peu commun'],[1,'commun']]
      .map(([n,t])=>legRow('<span class="dot" style="background:'+RAR[n]+'"></span>',n+' — '+t)).join(''));
    S.push('<b>Type de lieu</b>'+[['civil','civil'],['arene','arène'],['academie','académie'],
      ['guilde','guilde'],['sanctuaire','sanctuaire']].map(([k,t])=>legRow(swMk(k,0),t)).join('')+
      legRow(swMk('civil',1),'capitale / étoile'));
  }
  if(on('Royaumes')) S.push('<b>Royaumes</b><div class="note">Aplat coloré, un ton par royaume ; le nom est gravé sur le territoire.</div>');
  if(on('Provinces')) S.push('<b>Provinces</b>'+legRow(swLine('#111111',1.4,0,.85),'limite de province'));
  if(on('Rivières')) S.push('<b>Rivières (débit)</b>'+legRow(swLine('#5a97cf',1.9,0,.9),'fort')+
    legRow(swLine('#5a97cf',1.2,0,.9),'moyen')+legRow(swLine('#5a97cf',.8,0,.9),'faible'));
  if(on('Routes')) S.push('<b>Routes</b>'+legRow(swLine(rtCol,1.9,0,.85),'grand axe')+
    legRow(swLine(rtCol,1.2,0,.8),'secondaire')+legRow(swLine(rtCol,.7,0,.75),'locale')+
    legRow(swLine(rtCol,.5,'2,3',.7),'piste'));
  if(on('Routes maritimes')) S.push('<b>Routes maritimes</b>'+legRow(swLine('#3f8fa0',1.4,'5,5',.8),'grande ligne')+
    legRow(swLine('#3f8fa0',1,'4,5',.75),'secondaire')+legRow(swLine('#3f8fa0',.7,'3,4',.7),'cabotage'));
  if(on('Courants marins')) S.push('<b>Courants marins</b>'+legRow(swLine('#5fb0d8',1.4,0,.6),'sens du courant'));
  if(on('Terres sauvages')) S.push('<b>Terres sauvages</b><div class="note">Élément par couleur : voir le panneau dédié, à droite.</div>');
  if(!S.length) S.push('<div class="note">Aucune couche active — ouvrez le sélecteur en haut à droite.</div>');
  el.innerHTML='<div class="hd">Légende<span onclick="legendToggle(false)" title="Masquer">✕</span></div>'+S.join('');
}
buildLegend(); legendToggle(legendOpen);

let tzLayer=null, tzOn=false;
function terresHover(on){ tzOn=on;
  if(on){ if(!tzLayer) INARAMA.loadOnce('terres_zones',d=>{ tzLayer=gj(d,{renderer:tzRenderer,pane:'tz',
            style:()=>({stroke:false,fill:true,fillColor:'#000',fillOpacity:0}),
            onEachFeature:(f,l)=>{ const e=f.properties.e;
              l.bindTooltip('<span class="tzsw" style="background:'+(ELEMCOL[e]||'#9aa0a6')+'"></span>'+e,
                {sticky:true,className:'tztip',direction:'top',offset:[0,-4]}); }});
            if(tzOn) tzLayer.addTo(map); });
          else if(!map.hasLayer(tzLayer)) tzLayer.addTo(map); }
  else if(tzLayer) map.removeLayer(tzLayer);
}
